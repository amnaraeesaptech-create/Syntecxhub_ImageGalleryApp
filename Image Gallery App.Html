<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7ff;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .image-box {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .image-box img {
            width: 100%;
            display: block;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .image-box:hover img {
            transform: scale(1.1);
            filter: brightness(70%);
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            opacity: 0;
            transition: 0.4s;
        }

        .image-box:hover .caption {
            opacity: 1;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
        }
    </style>

</head>

<body>

    <h1>Image Gallery</h1>

    <div class="gallery">

        <div class="image-box">
            <img src="../images/Beautiful Nature.png" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="image-box">
            <img src="../images/Mountain View.png" alt="Mountains">
            <div class="caption">Mountain View</div>
        </div>

        <div class="image-box">
            <img src="../images/City Lights.png" alt="City">
            <div class="caption">City Lights</div>
        </div>

        <div class="image-box">
            <img src="../images/Sea Waves.png" alt="Sea Waves">
            <div class="caption">Sea Waves</div>
        </div>

        <div class="image-box">
            <img src="../images/Green Forest.png" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="image-box">
            <img src="../images/Technology.png" alt="Technology">
            <div class="caption">Modern Technology</div>
        </div>

    </div>

</body>

</html>
